name: Cinematic Quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Cinematic motion and experience data tests
        run: bun run test:cinematic
      - name: TypeScript check
        run: bunx tsc --noEmit
      - name: ESLint (experience code and logic rules)
        run: |
          bunx eslint src/components/cinematic src/lib/cinematic-progress.ts src/data/*.ts src/routes/index.tsx tests/*.test.mjs --rule "prettier/prettier: off"
      - name: Production build
        run: bun run build
